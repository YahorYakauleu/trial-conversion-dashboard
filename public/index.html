<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billing Dashboard</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
  <script>
    // Тема до отрисовки, чтобы не мигало: light | dark. Выбор хранится в браузере, без выбора — как в системе
    let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') theme = saved;
    } catch {}
    document.documentElement.dataset.theme = theme;
  </script>
</head>
<body>
<div class="layout">
  <!-- Панель выборки: экран, провайдер, период и фильтры по измерениям -->
  <aside class="sidebar" id="sidebar" aria-label="Выборка">
    <div class="brand">
      <img class="brand-mark" src="/assets/favicon.svg" alt="" />
      <div class="brand-name">Billing Dashboard</div>
    </div>

    <section class="side-group">
      <div class="side-label">Экран</div>
      <div class="seg" id="mode" role="group" aria-label="Экран">
        <button data-v="conversion">Конверсия</button><button data-v="turnover">Оборот</button>
      </div>
    </section>

    <section class="side-group">
      <div class="side-label">Провайдер</div>
      <div class="seg" id="provider" role="group" aria-label="Провайдер">
        <button data-v="all">Все</button><button data-v="stripe">Stripe</button><button data-v="solidgate">Solidgate</button>
      </div>
    </section>

    <section class="side-group">
      <div class="side-label">Период</div>
      <button class="picker" id="period" aria-haspopup="dialog"></button>
    </section>

    <section class="side-group">
      <div class="side-label">Фильтры <button class="link-btn" id="reset-filters" hidden>Сбросить</button></div>
      <div class="filters" id="filters"></div>
    </section>

    <div class="side-foot">
      <div class="who"><b id="role"></b>
        <form method="post" action="/logout"><button class="link-btn" type="submit">Выйти</button></form>
      </div>
      <div class="seg icons" id="theme" role="group" aria-label="Тема">
        <button data-v="light" title="Светлая"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-v="dark" title="Тёмная"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="overlay" id="sidebar-overlay" hidden></div>

  <main class="content">
    <header class="topbar">
      <button class="btn menu-btn" id="menu-open" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span>Выборка</span>
      </button>
      <div class="page-title">
        <h1 id="title">Конверсия триалов</h1>
        <div class="muted" id="subtitle"></div>
      </div>
      <div class="actions">
        <button class="btn" id="help-open" title="Как считаются метрики">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg>
          <span>Как считается</span>
        </button>
        <button class="btn" id="refresh" title="Запустить синк" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Обновить</span>
        </button>
      </div>
    </header>

    <div class="status" id="status"></div>
    <div class="chips" id="chips"></div>

    <div id="content">
      <section class="kpis" id="kpis"></section>

      <nav class="tabs" id="view" aria-label="Разрез"></nav>

      <div class="view-head">
        <div class="seg" id="granularity" role="group" aria-label="Шаг">
          <button data-v="day">День</button><button data-v="week">Неделя</button><button data-v="month">Месяц</button>
        </div>
        <span class="hint" id="hint"></span>
      </div>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="more" id="more" hidden><button class="btn" id="show-all"></button></div>
      </section>

      <!-- Графики — под таблицей -->
      <section id="charts">
        <div class="panel">
          <div class="chart-head">
            <h2>Конверсия по дню оформления, %</h2>
            <div class="legend">
              <span><i style="background: var(--s-converted)"></i>Сконвертилось</span>
              <span><i style="background: var(--s-first)"></i>С первой попытки</span>
              <span><i class="dashed"></i>≈ неокончательно</span>
            </div>
          </div>
          <div class="chart"><canvas id="rate-chart" aria-label="Конверсия триалов в платные, проценты"></canvas></div>
        </div>
        <div class="panel">
          <div class="chart-head"><h2>Оформлено триалов</h2></div>
          <div class="chart small"><canvas id="count-chart" aria-label="Число оформленных триалов"></canvas></div>
        </div>
      </section>

      <section id="turnover-charts" hidden>
        <div class="panel">
          <div class="chart-head"><h2>Оборот, $</h2></div>
          <div class="chart"><canvas id="turnover-chart" aria-label="Оборот по дате платежа, доллары"></canvas></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="overlay" id="help-overlay" hidden></div>
<aside class="drawer" id="help" role="dialog" aria-modal="true" aria-label="Как считаются метрики" hidden>
  <div class="drawer-head">
    <div class="seg" id="help-tabs" role="tablist" aria-label="Раздел">
      <button data-v="metrics" role="tab">Метрики</button><button data-v="data-sources" role="tab">Откуда данные</button>
    </div>
    <button class="btn" id="help-close" aria-label="Закрыть">✕</button>
  </div>
  <article class="doc" id="help-body">Загрузка…</article>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
