<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trial → Paid</title>
  <style>
    :root {
      --text: #1f1f1d; --muted: #6b6b66; --line: #e6e6e1; --card: #f5f5f1; --bg: #ffffff;
      --ok: #0f6e56; --err: #a32d2d; --bar: #d3d1c7; --first: #1d9e75; --retry: #534ab7;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ecebe6; --muted: #9c9b95; --line: #34332f; --card: #24231f; --bg: #171614;
        --ok: #5dcaa5; --err: #f09595; --bar: #3a3935; --first: #5dcaa5; --retry: #afa9ec;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
    button, select, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
    button { cursor: pointer; }
    button:hover { background: var(--card); }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: var(--err); }
    .controls { display: flex; gap: 12px 20px; margin: 20px 0 16px; flex-wrap: wrap; align-items: center; }
    .seg { display: flex; gap: 4px; }
    .seg button.on { background: var(--card); font-weight: 600; }
    .period { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { background: var(--card); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
    .card b { font-size: 26px; font-weight: 600; }
    .chart { position: relative; height: 320px; margin: 24px 0 8px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; }
    .swatch { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 6px; }
    .table-wrap { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; }
    th:first-child, td:first-child { text-align: left; }
    .pending { color: var(--muted); }
    tr.link { cursor: pointer; }
    tr.link:hover td { background: var(--card); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Trial → Paid</h1>
      <div class="muted" id="status"></div>
    </div>
    <button id="refresh">Обновить</button>
  </header>

  <div class="controls">
    <div class="seg" id="provider">
      <button data-v="all">Все</button><button data-v="stripe">Stripe</button><button data-v="solidgate">Solidgate</button>
    </div>
    <div class="seg" id="granularity">
      <button data-v="day">По дням</button><button data-v="week">По неделям</button><button data-v="month">По месяцам</button><button data-v="country">По странам</button>
    </div>
    <select id="country" aria-label="Страна"></select>
    <div class="period">
      <select id="preset" aria-label="Период">
        <option value="last7">Последние 7 дней</option>
        <option value="last30">Последние 30 дней</option>
        <option value="thisMonth">Этот месяц</option>
        <option value="prevMonth">Прошлый месяц</option>
        <option value="all">Всё время</option>
        <option value="custom">Свой период</option>
      </select>
      <label class="muted">с <input type="date" id="from" /></label>
      <label class="muted">по <input type="date" id="to" /></label>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th id="period-head">Дата оформления</th><th>Оформлено триалов</th><th>Сконвертилось</th><th>из них с первой попытки</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="chart" id="chart-box"><canvas id="chart" aria-label="Конверсия триалов в платные по дню оформления триала"></canvas></div>
  <div class="legend muted" id="legend">
    <span><span class="swatch" style="background: var(--retry)"></span>Сконвертилось</span>
    <span><span class="swatch" style="background: var(--first)"></span>С первой попытки</span>
    <span><span class="swatch" style="background: var(--bar); height: 10px; width: 10px"></span>Оформлено триалов</span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const DAY_MS = 86_400_000;
  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const PRESETS = ['last7', 'last30', 'thisMonth', 'prevMonth', 'all', 'custom'];

  // Выбор хранится в адресе страницы — ссылкой можно поделиться
  const params = new URLSearchParams(location.search);
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  const state = {
    provider: pick(params.get('provider'), ['all', 'stripe', 'solidgate'], 'all'),
    granularity: pick(params.get('granularity'), ['day', 'week', 'month', 'country'], 'day'),
    country: /^([A-Z]{2}|none)$/.test(params.get('country') ?? '') ? params.get('country') : 'all',
    preset: pick(params.get('period'), PRESETS, params.get('from') ? 'custom' : 'all'),
    from: params.get('from') ?? '',
    to: params.get('to') ?? '',
  };

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  // От origin, а не от адреса страницы: если дашборд открыт как user:pass@host, fetch отвергает относительный URL
  const api = (path, init) => fetch(new URL(path, location.origin), init);
  let chart;
  let pollTimer;

  const pct = (r) => (r === null ? '—' : `${(r * 100).toFixed(1)}%`);
  const num = (n) => n.toLocaleString('ru-RU');
  let timeZone = 'America/New_York';
  const when = (ts) =>
    ts
      ? new Date(ts * 1000).toLocaleString('ru-RU', { timeZone, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' })
      : 'ещё не было';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ddmm = (d) => `${d.slice(8, 10)}.${d.slice(5, 7)}`;
  const ddmmyyyy = (d) => `${ddmm(d)}.${d.slice(0, 4)}`;
  const monthName = (d) => `${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
  const isMonthEnd = (d) => new Date(Date.parse(`${d}T00:00:00Z`) + DAY_MS).getUTCDate() === 1;
  const regionNames = new Intl.DisplayNames(['ru'], { type: 'region' });
  const countryName = (code) => {
    if (!code || code === 'none') return 'Не определена';
    try {
      return `${regionNames.of(code)} (${code})`;
    } catch {
      return code;
    }
  };

  // Параметры запроса и адреса страницы; режим «По странам» берёт разбивку из того же ответа
  function query() {
    const q = new URLSearchParams({ provider: state.provider, granularity: state.granularity, period: state.preset });
    if (state.preset === 'custom') {
      q.set('from', state.from);
      q.set('to', state.to);
    }
    if (state.country !== 'all') q.set('country', state.country);
    return q;
  }

  function syncUrl() {
    history.replaceState(null, '', `${location.pathname}?${query()}`);
  }

  async function load() {
    clearTimeout(pollTimer);
    syncUrl();
    try {
      // Пресет («последние 7 дней» и т.п.) разбирает сервер — по «сегодня» в часовом поясе дашборда
      const q = query();
      if (state.granularity === 'country') q.set('granularity', 'day');
      const res = await api(`/api/metrics?${q}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderControls(data);
      renderStatus(data);
      renderCards(data.totals, data.range);
      const byCountry = state.granularity === 'country';
      document.getElementById('chart-box').hidden = byCountry;
      document.getElementById('legend').hidden = byCountry;
      if (byCountry) {
        renderCountryTable(data.countries);
      } else {
        renderTable(data.series);
        renderChart(data.series);
      }
      if (data.sync_running) pollTimer = setTimeout(load, 10_000);
    } catch (error) {
      document.getElementById('status').innerHTML = `<span class="err">Не удалось загрузить данные: ${esc(error.message)}</span>`;
    }
  }

  function renderControls(data) {
    timeZone = data.time_zone;
    for (const id of ['provider', 'granularity']) {
      document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset.v === state[id]));
    }
    document.getElementById('preset').value = state.preset;
    // В полях — фактический период после обрезки сервером
    for (const id of ['from', 'to']) {
      const input = document.getElementById(id);
      input.min = data.history_from;
      input.max = data.today;
      input.value = data.range[id];
    }
    document.getElementById('period-head').textContent =
      { day: 'Дата оформления', week: 'Неделя оформления', month: 'Месяц оформления', country: 'Страна карты' }[state.granularity];

    // Страны за выбранный период, по убыванию числа триалов; выбранная остаётся в списке, даже если в периоде её нет
    const select = document.getElementById('country');
    const codes = data.countries.map((c) => c.country ?? 'none');
    if (state.country !== 'all' && !codes.includes(state.country)) codes.push(state.country);
    select.innerHTML = ['<option value="all">Все страны</option>']
      .concat(codes.map((code) => `<option value="${code}">${esc(countryName(code))}</option>`))
      .join('');
    select.value = state.country;
    select.hidden = state.granularity === 'country';
  }

  // Под заголовком — только ошибки синка; когда всё в порядке, строка пустая
  function renderStatus(data) {
    const errors = data.sync
      .filter((s) => s.last_status === 'error')
      .map((s) => {
        const label = `${s.provider === 'stripe' ? 'Stripe' : 'Solidgate'} ${s.account}`;
        return `<span class="err">${label}: синк упал — ${esc(s.last_error ?? '')} (последний успешный: ${when(s.last_success_at)})</span>`;
      });
    document.getElementById('status').innerHTML = errors.join(' · ');
    document.getElementById('refresh').textContent = data.sync_running ? 'Идёт синк…' : 'Обновить';
  }

  function renderCards(t, range) {
    const approx = (final) => (final ? '' : '≈ ');
    document.getElementById('cards').innerHTML = [
      ['Оформлено триалов', num(t.started), `${ddmmyyyy(range.from)} — ${ddmmyyyy(range.to)}`],
      ['Сконвертилось', `${approx(t.final_retry)}${pct(t.rate_retry)}`, `${num(t.paid_retry)} из ${num(t.started)}`],
      ['Из них с первой попытки', `${approx(t.final_first)}${pct(t.rate_first)}`, `${num(t.paid_first)} из ${num(t.started)}`],
    ]
      .map(([label, value, sub]) => `<div class="card"><span class="muted">${label}</span><b>${value}</b><span class="muted">${sub}</span></div>`)
      .join('');
  }

  function rowLabel(p) {
    if (state.granularity === 'day') return ddmmyyyy(p.period);
    if (state.granularity === 'week') return `${ddmm(p.period)} — ${ddmm(p.period_end)}`;
    const name = monthName(p.period);
    const full = p.period.endsWith('-01') && isMonthEnd(p.period_end);
    return full ? name : `${name} (${ddmm(p.period)} — ${ddmm(p.period_end)})`;
  }

  // Новые периоды сверху: «01.09 оформлено N триалов, из них сконвертилось M (x%)»
  function renderTable(series) {
    const cell = (n, r, final) => `<td class="${final ? '' : 'pending'}">${final ? '' : '≈ '}${num(n)} (${pct(r)})</td>`;
    document.getElementById('rows').innerHTML = [...series]
      .reverse()
      .map(
        (p) =>
          `<tr><td>${rowLabel(p)}</td><td>${num(p.started)}</td>${cell(p.paid_retry, p.rate_retry, p.final_retry)}${cell(p.paid_first, p.rate_first, p.final_first)}</tr>`,
      )
      .join('');
  }

  // Режим «По странам»: клик по строке — динамика этой страны по дням
  function renderCountryTable(countries) {
    const cell = (n, r, final) => `<td class="${final ? '' : 'pending'}">${final ? '' : '≈ '}${num(n)} (${pct(r)})</td>`;
    document.getElementById('rows').innerHTML = countries
      .map(
        (c) =>
          `<tr class="link" data-country="${c.country ?? 'none'}"><td>${esc(countryName(c.country))}</td><td>${num(c.started)}</td>${cell(c.paid_retry, c.rate_retry, c.final_retry)}${cell(c.paid_first, c.rate_first, c.final_first)}</tr>`,
      )
      .join('');
  }

  function renderChart(series) {
    const dashed = (key) => (ctx) => (series[ctx.p1DataIndex][key] ? undefined : [5, 4]);
    const toPct = (r) => (r === null ? null : +(r * 100).toFixed(1));
    const line = (label, key, finalKey, color, order) => ({
      type: 'line', label, data: series.map((p) => toPct(p[key])), yAxisID: 'rate', order,
      borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: series.length > 40 ? 0 : 3,
      tension: 0.2, spanGaps: true, segment: { borderDash: dashed(finalKey) },
    });
    const datasets = [
      { type: 'bar', label: 'Оформлено триалов', data: series.map((p) => p.started), backgroundColor: css('--bar'), yAxisID: 'count', order: 3 },
      line('Сконвертилось', 'rate_retry', 'final_retry', css('--retry'), 1),
      line('С первой попытки', 'rate_first', 'final_first', css('--first'), 2),
    ];
    const labels = series.map((p) => (state.granularity === 'month' ? monthName(p.period) : ddmm(p.period)));

    Chart.defaults.color = css('--muted');
    Chart.defaults.borderColor = css('--line');
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: { labels, datasets },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => rowLabel(series[items[0].dataIndex]),
              label: (c) => (c.datasetIndex === 0 ? `${c.dataset.label}: ${num(c.raw)}` : `${c.dataset.label}: ${c.raw ?? '—'}%`),
            },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 16 } },
          rate: { position: 'left', min: 0, ticks: { callback: (v) => `${v}%` } },
          count: { position: 'right', grid: { display: false }, ticks: { callback: (v) => num(v) } },
        },
      },
    });
  }

  for (const id of ['provider', 'granularity']) {
    document.getElementById(id).addEventListener('click', (event) => {
      const value = event.target.dataset?.v;
      if (!value) return;
      state[id] = value;
      if (value === 'country') state.country = 'all'; // разбивка — по всем странам
      load();
    });
  }

  document.getElementById('country').addEventListener('change', (event) => {
    state.country = event.target.value;
    load();
  });

  document.getElementById('rows').addEventListener('click', (event) => {
    const row = event.target.closest('tr[data-country]');
    if (!row) return;
    state.country = row.dataset.country;
    state.granularity = 'day';
    load();
  });

  document.getElementById('preset').addEventListener('change', (event) => {
    state.preset = event.target.value;
    if (state.preset === 'custom') return; // ждём, пока выберут даты
    load();
  });

  for (const id of ['from', 'to']) {
    document.getElementById(id).addEventListener('change', (event) => {
      if (!event.target.value) return;
      state.preset = 'custom';
      state.from = document.getElementById('from').value;
      state.to = document.getElementById('to').value;
      load();
    });
  }

  document.getElementById('refresh').addEventListener('click', async () => {
    await api('/api/sync', { method: 'POST' });
    load();
  });

  load();
</script>
</body>
</html>
